<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TreeCall</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root { --blue:#3aa8ff; --glow:0 0 24px rgba(58,168,255,.55); --bg:#05070c; --panel:#0c111b; --line:#1b2534; --txt:#e8f1ff; --dim:#7f8da3; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:15px/1.4 -apple-system,system-ui,Helvetica,Arial,sans-serif; }
  button,select,input { font:inherit; color:var(--txt); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:9px 14px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--blue); box-shadow:var(--glow); }
  button.on { background:var(--blue); color:#001; border-color:var(--blue); }
  .orb { width:34px; height:34px; border-radius:50%; background:radial-gradient(circle at 40% 35%,#9fd6ff,var(--blue) 45%,#0a3d73 80%); box-shadow:var(--glow); position:relative; flex:none; }
  .orb::before,.orb::after { content:""; position:absolute; background:#fff; box-shadow:0 0 8px #fff; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:2px; }
  .orb::before { width:16px; height:3px; } .orb::after { width:3px; height:16px; }
  .app { display:grid; grid-template-rows:auto 1fr auto; height:100%; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; flex-wrap:wrap; }
  header b { font-size:18px; letter-spacing:.5px; }
  #status { color:var(--dim); font-size:13px; }
  main { display:grid; grid-template-columns:1fr 300px; gap:12px; padding:0 16px; min-height:0; }
  .stage { position:relative; background:#000; border-radius:18px; overflow:hidden; border:1px solid var(--line); min-height:240px; }
  #remote { width:100%; height:100%; object-fit:contain; background:#000; }
  #local { position:absolute; right:12px; bottom:12px; width:24%; max-width:220px; border-radius:12px; border:1px solid var(--line); background:#111; }
  .empty { position:absolute; inset:0; display:grid; place-items:center; color:var(--dim); text-align:center; padding:20px; }
  .side { display:flex; flex-direction:column; gap:10px; min-height:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .card label { font-size:12px; color:var(--dim); }
  .card select { border-radius:10px; width:100%; }
  .chat { flex:1; min-height:160px; }
  #msgs { flex:1; overflow:auto; display:flex; flex-direction:column; gap:6px; min-height:80px; }
  .m { padding:6px 10px; border-radius:12px; background:#131b28; max-width:90%; word-wrap:break-word; }
  .m.me { align-self:flex-end; background:#0f3a63; }
  .chatrow { display:flex; gap:6px; } .chatrow input { flex:1; border-radius:12px; min-width:0; }
  footer { display:flex; gap:8px; justify-content:center; padding:12px; flex-wrap:wrap; }
  #linkbox { display:none; gap:6px; align-items:center; }
  #linkbox input { width:260px; border-radius:10px; font-size:12px; }
  /* Clean view for OBS window capture: only your friend, full window */
  body.clean header, body.clean .side, body.clean footer, body.clean #local, body.clean .empty { display:none !important; }
  body.clean main { grid-template-columns:1fr; padding:0; }
  body.clean .stage { border:0; border-radius:0; }
  body.clean .app { grid-template-rows:0 1fr 0; }
  @media (max-width:760px) { main { grid-template-columns:1fr; } .stage { min-height:50vh; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="orb"></div><b>TreeCall</b>
    <span id="status">1️⃣ Turn on camera</span>
    <span id="linkbox"><input id="link" readonly><button id="copy">📋 Copy link</button></span>
  </header>
  <main>
    <div class="stage">
      <video id="remote" autoplay playsinline></video>
      <div class="empty" id="empty">🔵 Your friend shows up here</div>
      <video id="local" autoplay playsinline muted></video>
    </div>
    <div class="side">
      <div class="card">
        <label>📷 Camera (pick "OBS Virtual Camera" to send your stream feed)</label>
        <select id="camSel"><option>—</option></select>
        <label>🎙️ Mic</label>
        <select id="micSel"><option>—</option></select>
      </div>
      <div class="card chat">
        <div id="msgs"></div>
        <div class="chatrow"><input id="txt" placeholder="💬 type…" maxlength="500"><button id="send">➤</button></div>
      </div>
    </div>
  </main>
  <footer>
    <button id="startCam">📷 Turn on camera</button>
    <button id="host" disabled>🔵 Start room</button>
    <button id="mute" disabled>🎙️ Mute</button>
    <button id="vidOff" disabled>📷 Hide video</button>
    <button id="clean">🎬 Clean view</button>
    <button id="hang" disabled>✖ Hang up</button>
  </footer>
</div>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const joinId = params.get('room');
let peer = null, call = null, conn = null, localStream = null;

const say = t => $('status').textContent = t;

// ---------- media ----------
async function getMedia(camId, micId) {
  const c = { video: camId ? { deviceId:{ exact:camId } } : true,
              audio: micId ? { deviceId:{ exact:micId } } : true };
  return navigator.mediaDevices.getUserMedia(c);
}
async function fillDevices() {
  const devs = await navigator.mediaDevices.enumerateDevices();
  const fill = (sel, kind, track) => {
    const cur = track && track.getSettings().deviceId;
    sel.innerHTML = '';
    devs.filter(d => d.kind === kind).forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId; o.textContent = d.label || (kind + ' ' + (i+1));
      if (d.deviceId === cur) o.selected = true;
      sel.appendChild(o);
    });
  };
  fill($('camSel'), 'videoinput', localStream && localStream.getVideoTracks()[0]);
  fill($('micSel'), 'audioinput', localStream && localStream.getAudioTracks()[0]);
}
async function startCam() {
  try {
    localStream = await getMedia();
    $('local').srcObject = localStream;
    await fillDevices();
    $('startCam').style.display = 'none';
    ['mute','vidOff'].forEach(b => $(b).disabled = false);
    if (joinId) { say('🔗 Joining room…'); joinRoom(); }
    else { $('host').disabled = false; say('2️⃣ Start a room'); }
  } catch (e) { say('⚠️ Camera/mic blocked: ' + e.name); }
}
// swap camera or mic mid-call without reconnecting
async function swap(kind) {
  const camId = $('camSel').value, micId = $('micSel').value;
  try {
    const s = await navigator.mediaDevices.getUserMedia(kind === 'video'
      ? { video:{ deviceId:{ exact:camId } } } : { audio:{ deviceId:{ exact:micId } } });
    const nt = s.getTracks()[0];
    const old = kind === 'video' ? localStream.getVideoTracks()[0] : localStream.getAudioTracks()[0];
    if (old) { nt.enabled = old.enabled; localStream.removeTrack(old); old.stop(); }
    localStream.addTrack(nt);
    $('local').srcObject = localStream;
    if (call && call.peerConnection) {
      const sender = call.peerConnection.getSenders().find(x => x.track && x.track.kind === kind);
      if (sender) await sender.replaceTrack(nt);
    }
  } catch (e) { say('⚠️ Could not switch: ' + e.name); }
}
$('camSel').onchange = () => localStream && swap('video');
$('micSel').onchange = () => localStream && swap('audio');

// ---------- call ----------
function wireCall(c) {
  call = c;
  c.on('stream', s => { $('remote').srcObject = s; $('empty').style.display = 'none'; say('🟢 Connected'); $('hang').disabled = false; });
  c.on('close', ended);
  c.on('error', ended);
}
function wireChat(c) {
  conn = c;
  c.on('data', d => { if (typeof d === 'string') addMsg(d, false); });
  c.on('close', () => { conn = null; });
}
function ended() {
  $('remote').srcObject = null; $('empty').style.display = 'grid';
  call = null; $('hang').disabled = true;
  say(joinId ? '⚪ Call ended — reload to rejoin' : '⚪ Call ended — waiting for friend');
}
function makeId() {
  const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = 'treecall-';
  const r = crypto.getRandomValues(new Uint8Array(10));
  r.forEach(n => s += a[n % a.length]); return s;
}
function hostRoom() {
  const id = makeId();
  peer = new Peer(id);
  $('host').disabled = true; say('⏳ Opening room…');
  peer.on('open', () => {
    const url = location.origin + location.pathname + '?room=' + id;
    $('link').value = url; $('linkbox').style.display = 'flex';
    say('3️⃣ Send this link to your friend 👉');
  });
  peer.on('call', c => { if (call) call.close(); c.answer(localStream); wireCall(c); });
  peer.on('connection', wireChat);
  peer.on('error', e => say('⚠️ ' + e.type));
}
function joinRoom() {
  peer = new Peer();
  peer.on('open', () => {
    wireCall(peer.call(joinId, localStream));
    wireChat(peer.connect(joinId, { reliable:true }));
  });
  peer.on('connection', wireChat);
  peer.on('error', e => say(e.type === 'peer-unavailable'
    ? '⚠️ Room not open — ask your friend to start it, then reload' : '⚠️ ' + e.type));
}

// ---------- chat ----------
function addMsg(t, me) {
  const d = document.createElement('div');
  d.className = 'm' + (me ? ' me' : ''); d.textContent = t;
  $('msgs').appendChild(d); $('msgs').scrollTop = 1e9;
}
function sendMsg() {
  const t = $('txt').value.trim(); if (!t) return;
  addMsg(t, true); $('txt').value = '';
  if (conn && conn.open) conn.send(t); else addMsg('(not connected yet)', false);
}
$('send').onclick = sendMsg;
$('txt').onkeydown = e => { if (e.key === 'Enter') sendMsg(); };

// ---------- buttons ----------
$('startCam').onclick = startCam;
$('host').onclick = hostRoom;
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('link').value); $('copy').textContent = '✅ Copied'; }
  catch { $('link').select(); }
};
$('mute').onclick = () => {
  const t = localStream.getAudioTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; $('mute').classList.toggle('on', !t.enabled);
  $('mute').textContent = t.enabled ? '🎙️ Mute' : '🔇 Muted';
};
$('vidOff').onclick = () => {
  const t = localStream.getVideoTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; $('vidOff').classList.toggle('on', !t.enabled);
  $('vidOff').textContent = t.enabled ? '📷 Hide video' : '🙈 Video hidden';
};
$('hang').onclick = () => { if (call) call.close(); ended(); };
$('clean').onclick = () => document.body.classList.add('clean');
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('clean'); });
$('remote').ondblclick = () => document.body.classList.toggle('clean');

if (joinId) { say('👋 You were invited — turn on camera to join'); $('startCam').textContent = '📷 Turn on camera & join'; }
if (!window.Peer) say('⚠️ Could not load call library — check internet');
</script>
</body>
